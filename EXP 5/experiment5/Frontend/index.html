<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 5.2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>Experiment 5.2</h1>
        <p>REST API User Management System</p>
    </header>

    <!-- Add User -->
    <section class="card">
        <h2>Add User</h2>

        <form id="userForm">

            <div class="form-group">
                <label for="uid">UID</label>
                <input
                    type="text"
                    id="uid"
                    placeholder="Enter UID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter name"
                    required
                >
            </div>

            <button type="submit">Add User</button>

        </form>

        <p id="message"></p>
    </section>


    <!-- Search User -->
    <section class="card">

        <h2>Search User</h2>

        <div class="search-box">

            <input
                type="text"
                id="searchUid"
                placeholder="Enter UID to search"
            >

            <button id="searchBtn">
                Search
            </button>

            <button id="clearBtn" type="button">
                Clear
            </button>

        </div>

    </section>


    <!-- User Records -->
    <section class="card">

        <div class="table-header">

            <h2>User Records</h2>

            <button id="refreshBtn" class="refresh-btn">
                Refresh
            </button>

        </div>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>UID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="userTableBody">
                </tbody>

            </table>

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
